# Scans dependencies and source for known vulnerabilities and committed secrets.
# Fails on high or critical findings that have a fix available. Documented
# exceptions live in .trivyignore and package.json (pnpm.auditConfig.ignoreGhsas).
name: Security Scans

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly: catch newly disclosed CVEs in dependencies that haven't changed
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Production dependencies only: dev tooling isn't deployed
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scans pnpm-lock.yaml for vulnerable packages and the repo for secrets
      - name: Run Trivy vulnerability and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          trivyignores: .trivyignore

      - name: Save output to workflow summary
        if: always() # Runs even if there is a failure
        run: echo "View results in GitHub Action logs" >> "$GITHUB_STEP_SUMMARY"
